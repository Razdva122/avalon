name: Check UI before release

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to validate
        type: string
        required: true
    outputs:
      artifact-name:
        description: Verified UI release artifact from this run
        value: ${{ jobs.check-ui.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: ui-preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  check-ui:
    name: UI release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      violations: ${{ steps.budget.outputs.violations }}
      artifact-name: ui-release-${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve checked commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3

      # The pinned Puppeteer image also pins the actual Node/Chrome build runtime.
      # No registry login or publishing is needed for PR and branch validation.
      - name: Build and audit UI in the release environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui.Dockerfile
          target: release-artifact
          outputs: type=local,dest=./ui-release
          platforms: linux/amd64
          cache-from: type=gha,scope=ui-release-check
          cache-to: type=gha,scope=ui-release-check,mode=max

      - name: Read bundle budget report
        id: budget
        run: |
          node -e 'const r = require("./ui-release/bundle-budget.json"); if (!Array.isArray(r.violations)) throw Error("Invalid budget report"); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `violations=${r.violations.length}\n`);'

      - name: Verify production nginx routing
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          SEO_DIST_DIR=./ui-release node packages/ui/scripts/check-seo-nginx.cjs

      - name: Save verified UI release
        uses: actions/upload-artifact@v4
        with:
          name: ui-release-${{ steps.source.outputs.sha }}
          path: ui-release/
          if-no-files-found: error
          retention-days: 1

  record-budget:
    needs: check-ui
    if: ${{ inputs.ref || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Persist bundle budget flag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VIOLATIONS: ${{ needs.check-ui.outputs.violations }}
          RELEASE_REF: ${{ inputs.ref }}
        with:
          script: |
            const count = Number(process.env.VIOLATIONS);
            if (!Number.isInteger(count) || count < 0 || process.env.VIOLATIONS === '') throw Error('Missing bundle budget report');
            const release = Boolean(process.env.RELEASE_REF);
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              context: release ? `avalon/bundle-budget/release-${context.runId}` : 'avalon/bundle-budget',
              state: count ? 'failure' : 'success',
              description: count ? `${count} bundle budget limit(s) exceeded; fix before next release` : 'Bundle size is within budget',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (count) core.warning(`${count} bundle budget limit(s) exceeded. This release may proceed; the next local release requires a verified fix.`);
