name: Publish release containers and game images

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Release images and build caches live in Docker Hub; skip diagnostic artifacts.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (for example v68.0.1)'
        required: true
        type: string
  push:
    tags: [v*.*.*]

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo '::error::Expected a version tag such as v68.0.1 or v68.0.1-rc.1'
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install nginx for routing checks
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Check mounted nginx configuration upgrade
        run: node --test deploy/nginx/*.test.cjs

      - name: Resolve immutable release commit
        id: release
        shell: bash
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The reusable check finishes before either container can be published.
  check-ui:
    needs: resolve-release
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/check-ui.yml
    with:
      ref: ${{ needs.resolve-release.outputs.sha }}

  # Publish backend image
  publish-backend:
    needs: [resolve-release, check-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: build and publish container in Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: backend.Dockerfile
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/backend-avalon:${{ needs.resolve-release.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/backend-avalon:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/backend-avalon:buildcache,mode=max

  # Package images with the exact audited UI build.
  publish-ui:
    needs: [resolve-release, check-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Download the verified UI release
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check-ui.outputs.artifact-name }}
          path: ui-release

      - name: Package and publish the same UI release
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui-release.Dockerfile
          push: true
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/nginx-avalon:${{ needs.resolve-release.outputs.tag }}
          platforms: linux/amd64

  cleanup-buildkit-caches:
    needs: [publish-backend, publish-ui]
    if: ${{ needs.publish-backend.result == 'success' && needs.publish-ui.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual publication of an older tag still uses this workflow's cleanup script.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Clean obsolete release BuildKit caches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-buildkit-caches.cjs');
            await cleanup({ github, context, core });
