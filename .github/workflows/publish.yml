name: Publish release containers and game images

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (for example v68.0.1)'
        required: true
        type: string
  push:
    tags: [v*.*.*]

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo '::error::Expected a version tag such as v68.0.1 or v68.0.1-rc.1'
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install nginx for routing checks
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Check mounted nginx configuration upgrade
        run: node --test deploy/nginx/*.test.cjs

      - name: Resolve immutable release commit
        id: release
        shell: bash
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Publish backend image
  publish-backend:
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: build and publish container in Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: backend.Dockerfile
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/backend-avalon:${{ needs.resolve-release.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/backend-avalon:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/backend-avalon:buildcache,mode=max

  # Publish UI only after its exact build assets are public in Object Storage.
  publish-ui:
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3

      - name: Check storage upload prerequisites
        env:
          HAS_STORAGE_ACCESS_KEY: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID != '' }}
          HAS_STORAGE_SECRET_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY != '' }}
        run: |
          test "$HAS_STORAGE_ACCESS_KEY" = true || { echo 'Missing YC_STORAGE_ACCESS_KEY_ID repository secret'; exit 1; }
          test "$HAS_STORAGE_SECRET_KEY" = true || { echo 'Missing YC_STORAGE_SECRET_ACCESS_KEY repository secret'; exit 1; }
          aws --version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and export the audited UI release
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui.Dockerfile
          target: release-artifact
          outputs: type=local,dest=./ui-release
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/nginx-avalon:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/nginx-avalon:buildcache,mode=max

      - name: Verify exported pages with production nginx routing
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          SEO_DIST_DIR=./ui-release node packages/ui/scripts/check-seo-nginx.cjs

      - name: Upload and verify game images in Yandex Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
        run: node packages/ui/scripts/upload-images.cjs ./ui-release

      - name: Package and publish the same UI release
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui-release.Dockerfile
          push: true
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/nginx-avalon:${{ needs.resolve-release.outputs.tag }}
          platforms: linux/amd64

  cleanup-buildkit-caches:
    needs: [publish-backend, publish-ui]
    if: ${{ needs.publish-backend.result == 'success' && needs.publish-ui.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual publication of an older tag still uses this workflow's cleanup script.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Clean obsolete release BuildKit caches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-buildkit-caches.cjs');
            await cleanup({ github, context, core });
