user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

	# Enable GZip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_min_length 256;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;

  server {
    listen       80;
    server_name  avalon-game.com;
    return 301 https://$server_name$request_uri;
  }

	server {
		listen       443 ssl http2;
    server_name www.avalon-game.com;
		ssl_certificate /etc/ssl/bundle.crt;
		ssl_certificate_key /etc/ssl/key.txt;
		return 301 $scheme://avalon-game.com$request_uri;
	}

  server {
    listen       443 ssl http2;
    server_name  avalon-game.com;
		ssl_certificate /etc/ssl/bundle.crt;
		ssl_certificate_key /etc/ssl/key.txt;
		ssl_session_timeout 5m;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
		ssl_prefer_server_ciphers on;
    root /app;
    index index.html;

    # One English URL per page. Preserve query strings on permanent redirects.
    rewrite ^/(?:en|ru|zh-tw|zh-cn|es|pt)/((?:profile|leaderboard|achievements/global|room/[^/]+|stats/user/[^/]+|achievements/user/[^/]+)/?)$ /$1 permanent;
    rewrite ^/en(?:/(.*))?$ /$1 permanent;
    rewrite ^/((?:ru/|zh-tw/|zh-cn/|es/|pt/)?)wiki/addons/(lady|lady_sea|excalibur|plot_cards)/?$ /$1wiki/expansions/$2/ permanent;
    rewrite ^/((?:ru/|zh-tw/|zh-cn/|es/|pt/)?)wiki/addons/?$ /$1wiki/expansions/ permanent;
    rewrite ^/((?:ru/|zh-tw/|zh-cn/|es/|pt/)?)wiki/roles/(?:isolde|tristan)/?$ /$1wiki/roles/lovers/ permanent;
    rewrite ^/((?:ru/|zh-tw/|zh-cn/|es/|pt/)?)wiki/roles/wraith/?$ /$1wiki/roles/oberon/ permanent;
    rewrite ^/((?:ru/|zh-tw/|zh-cn/|es/|pt/)?)wiki/roles/(?:evil_lancelot|good_lancelot)/?$ /$1wiki/roles/lancelots/ permanent;

    # Only actual application routes receive the SPA shell.
    location ~ ^/(?:ru/|zh-tw/|zh-cn/|es/|pt/)?(?:profile|leaderboard|achievements/global|room/[^/]+|stats/user/[^/]+|achievements/user/[^/]+)/?$ {
      add_header X-Robots-Tag "noindex, follow" always;
      try_files /index.html =404;
    }

    location ~ ^/(?:ru/|zh-tw/|zh-cn/|es/|pt/)?404/?$ {
      return 404;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
      internal;
      add_header X-Robots-Tag "noindex, follow" always;
    }

    # Content-hashed assets are immutable; HTML must remain revalidatable on releases.
    location ~* "^/(?:js|css|fonts)/.+\.[a-f0-9]{8}\.(?:js|css|woff2?|ttf|otf)$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }
    location /socket.io {
      proxy_pass http://avalon-game.com:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
